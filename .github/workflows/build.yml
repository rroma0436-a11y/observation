name: CI Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Лише те, що потрібно для збірки під Android (SDL/ffmpeg для Android не потрібні —
    # buildozer збирає їх сам із вихідників)
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          zip \
          unzip \
          autoconf \
          automake \
          libtool \
          libltdl-dev \
          pkg-config \
          cmake \
          zlib1g-dev \
          libncurses-dev \
          libffi-dev \
          libssl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36 buildozer

    # Кеш SDK/NDK і зібраних бібліотек — повторні збірки йдуть у рази швидше
    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-global-${{ runner.os }}-

    - name: Cache Buildozer project directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-project-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-project-${{ runner.os }}-

    # Відновлюємо keystore із секрету (сам файл ключа в репозиторій НЕ кладемо)
    - name: Decode release keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::Секрет KEYSTORE_BASE64 не задано (Settings → Secrets and variables → Actions)"
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

    - name: Build signed APK with Buildozer
      env:
        P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
        P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
        P4A_RELEASE_KEYALIAS: observation_alias
        P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
      run: |
        buildozer -v android release

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-release-apk
        path: bin/*.apk
        if-no-files-found: error

    - name: Remove keystore
      if: always()
      run: rm -f "$RUNNER_TEMP/release.keystore"
